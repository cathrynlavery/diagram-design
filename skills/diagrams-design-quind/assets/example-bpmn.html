<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un cambio llega a producción solo con pruebas en verde y aprobación del comité</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Roboto+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;   /* white-smoke */
      --color-ink:     #0e1920;   /* jet-black */
      --color-muted:   #5b6770;   /* blue-slate */
      --color-accent:  #cc3b10;   /* burnt-tangerine */
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Poppins', 'Inter', system-ui, sans-serif;
      --font-mono:     'Roboto Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1120px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">BPMN · Proceso</p>
    <h1>Un cambio llega a producción solo con pruebas en verde y aprobación del comité</h1>

        <desc id="bpmn-desc">Proceso BPMN con una piscina y tres carriles: el líder técnico registra la solicitud, la plataforma valida el cambio, el comité lo aprueba y la plataforma lo despliega; si las pruebas fallan o no se aprueba, el cambio se devuelve.</desc>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b6e80"/></marker>

        <text x="56" y="350" fill="#66727c" font-size="8" font-family="'Roboto Mono', monospace">ejecuta</text>

        <line x1="416" y1="340" x2="468" y2="340" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="488" y1="320" x2="488" y2="264" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="508" y1="340" x2="624" y2="340" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="564" y1="236" x2="616" y2="236" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="636" y1="256" x2="636" y2="328" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 656,236 H 808 Q 816,236 816,244 V 312" fill="none" stroke="#cc3b10" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="892" y1="340" x2="940" y2="340" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Salidas de las compuertas -->
        <rect x="494" y="287" width="20" height="12" rx="2" fill="#ffffff"/><text x="504" y="296" fill="#0e1920" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Sí</text>
        <rect x="550" y="319" width="20" height="12" rx="2" fill="#ffffff"/><text x="560" y="328" fill="#0e1920" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">No</text>
        <rect x="642" y="287" width="20" height="12" rx="2" fill="#ffffff"/><text x="652" y="296" fill="#0e1920" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">No</text>
        <rect x="710" y="215" width="20" height="12" rx="2" fill="#ffffff"/><text x="720" y="224" fill="#0e1920" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Sí</text>

        <rect x="264" y="104" width="152" height="56" rx="6" fill="#ffffff"/><rect x="264" y="104" width="152" height="56" rx="6" fill="#ffffff" stroke="#0e1920" stroke-width="1"/><svg x="272" y="111" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0e1920" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /> <circle cx="12" cy="7" r="4" /></svg><text x="288" y="120" fill="#0e1920" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" letter-spacing="0.08em">HUMANA</text><text x="272" y="138" fill="#0e1920" font-size="11" font-weight="600" font-family="'Inter', sans-serif">Registrar la solicitud</text><text x="272" y="151" fill="#5b6770" font-size="8" font-family="'Roboto Mono', monospace">ticket · alcance · plan</text>
        <rect x="264" y="312" width="152" height="56" rx="6" fill="#ffffff"/><rect x="264" y="312" width="152" height="56" rx="6" fill="rgba(11,110,128,0.06)" stroke="#0b6e80" stroke-width="1"/><svg x="272" y="319" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0b6e80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" /> <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" /> <path d="M12 2v2" /> <path d="M12 22v-2" /> <path d="m17 20.66-1-1.73" /> <path d="M11 10.27 7 3.34" /> <path d="m20.66 17-1.73-1" /> <path d="m3.34 7 1.73 1" /> <path d="M14 12h8" /> <path d="M2 12h2" /> <path d="m20.66 7-1.73 1" /> <path d="m3.34 17 1.73-1" /> <path d="m17 3.34-1 1.73" /> <path d="m11 13.73-4 6.93" /></svg><text x="288" y="328" fill="#0b6e80" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" letter-spacing="0.08em">AUTOMÁTICA</text><text x="272" y="346" fill="#0e1920" font-size="11" font-weight="600" font-family="'Inter', sans-serif">Validar el cambio</text><text x="272" y="359" fill="#5b6770" font-size="8" font-family="'Roboto Mono', monospace">pruebas · análisis estático</text>
        <path d="M 488,320 L 508,340 L 488,360 L 468,340 Z" fill="#ffffff" stroke="#0e1920" stroke-width="1"/><path d="M 483,335 L 493,345 M 493,335 L 483,345" stroke="#0e1920" stroke-width="1.2" fill="none"/><rect x="438" y="371" width="100" height="12" rx="2" fill="#ffffff"/><text x="488" y="380" fill="#0e1920" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">¿Pruebas en verde?</text>
        <rect x="412" y="208" width="152" height="56" rx="6" fill="#ffffff"/><rect x="412" y="208" width="152" height="56" rx="6" fill="rgba(154,100,0,0.08)" stroke="#9a6400" stroke-width="1"/><svg x="420" y="215" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9a6400" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22h14" /> <path d="M19.27 13.73A2.5 2.5 0 0 0 17.5 13h-11A2.5 2.5 0 0 0 4 15.5V17a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1.5c0-.66-.26-1.3-.73-1.77Z" /> <path d="M14 13V8.5C14 7 15 7 15 5a3 3 0 0 0-3-3c-1.66 0-3 1-3 3s1 2 1 3.5V13" /></svg><text x="436" y="224" fill="#9a6400" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" letter-spacing="0.08em">APROBACIÓN</text><text x="420" y="242" fill="#0e1920" font-size="11" font-weight="600" font-family="'Inter', sans-serif">Aprobar el cambio</text><text x="420" y="255" fill="#5b6770" font-size="8" font-family="'Roboto Mono', monospace">control AP-2</text>
        <path d="M 636,216 L 656,236 L 636,256 L 616,236 Z" fill="#ffffff" stroke="#0e1920" stroke-width="1"/><path d="M 631,231 L 641,241 M 641,231 L 631,241" stroke="#0e1920" stroke-width="1.2" fill="none"/><rect x="606" y="191" width="60" height="12" rx="2" fill="#ffffff"/><text x="636" y="200" fill="#0e1920" font-size="9" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">¿Aprobado?</text>
        <circle cx="636" cy="340" r="12" fill="#ffffff" stroke="#cc3b10" stroke-width="3"/><text x="636" y="368" fill="#5b6770" font-size="8.5" font-family="'Inter', sans-serif" text-anchor="middle">Cambio devuelto</text>
        <rect x="740" y="312" width="152" height="56" rx="6" fill="#ffffff"/><rect x="740" y="312" width="152" height="56" rx="6" fill="rgba(11,110,128,0.06)" stroke="#0b6e80" stroke-width="1"/><svg x="748" y="319" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0b6e80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" /> <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" /> <path d="M12 2v2" /> <path d="M12 22v-2" /> <path d="m17 20.66-1-1.73" /> <path d="M11 10.27 7 3.34" /> <path d="m20.66 17-1.73-1" /> <path d="m3.34 7 1.73 1" /> <path d="M14 12h8" /> <path d="M2 12h2" /> <path d="m20.66 7-1.73 1" /> <path d="m3.34 17 1.73-1" /> <path d="m17 3.34-1 1.73" /> <path d="m11 13.73-4 6.93" /></svg><text x="764" y="328" fill="#0b6e80" font-size="7" font-weight="500" font-family="'Roboto Mono', monospace" letter-spacing="0.08em">AUTOMÁTICA</text><text x="748" y="346" fill="#0e1920" font-size="11" font-weight="600" font-family="'Inter', sans-serif">Desplegar a producción</text><text x="748" y="359" fill="#5b6770" font-size="8" font-family="'Roboto Mono', monospace">canary · 10 % · 100 %</text>
        <circle cx="952" cy="340" r="12" fill="#ffffff" stroke="#2fa36b" stroke-width="3"/><text x="952" y="368" fill="#5b6770" font-size="8.5" font-family="'Inter', sans-serif" text-anchor="middle">Cambio en producción</text>
        
        <!-- Clave de notación -->
        <line x1="40" y1="420" x2="1080" y2="420" stroke="rgba(14,25,32,0.10)" stroke-width="0.8"/>
        <text x="40" y="436" fill="#5b6770" font-size="8" font-family="'Roboto Mono', monospace" letter-spacing="0.18em">CLAVE</text>

        <text x="296" y="456" fill="#5b6770" font-size="8.5" font-family="'Inter', sans-serif">Tarea automática</text>

  </div>
