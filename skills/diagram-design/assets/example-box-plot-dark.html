<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout's box is the incident · Box plot · dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Box plot · Diagram Design</p>
    <h1>Checkout's box is the incident</h1>

    <!-- Value axis: 0–400 ms over 800px, x = 160 + 2·ms, linear from zero.
         Each series is a five-number summary on that shared scale; category y
         is a label rail and carries no value. scripts/verify-box-plot.py
         derives the scale from the declared quartiles and flags any mark
         that disagrees with its peers. -->
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="box-plot-dark-title box-plot-dark-desc">
      <title id="box-plot-dark-title">Checkout's box is the incident</title>
      <desc id="box-plot-dark-desc">Horizontal box plots of per-request latency for five services on a shared linear axis from zero; Checkout's interquartile range runs from 80 to 200 ms with outliers at 388 and 396 ms.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
      <text x="560" y="456" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">PER-REQUEST LATENCY, MS</text>
      <line x1="160" y1="56" x2="160" y2="400" stroke="rgba(245,245,245,0.06)" stroke-width="0.8"/>
      <line x1="360" y1="56" x2="360" y2="400" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>
      <line x1="560" y1="56" x2="560" y2="400" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>
      <line x1="760" y1="56" x2="760" y2="400" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>
      <line x1="960" y1="56" x2="960" y2="400" stroke="rgba(245,245,245,0.06)" stroke-width="0.8"/>
      <line x1="160" y1="420" x2="960" y2="420" stroke="rgba(245,245,245,0.25)" stroke-width="1"/>
      <text data-tick="x" data-value="0" x="160" y="440" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>
      <text data-tick="x" data-value="100" x="360" y="440" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">100</text>
      <text data-tick="x" data-value="200" x="560" y="440" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200</text>
      <text data-tick="x" data-value="300" x="760" y="440" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">300</text>
      <text data-tick="x" data-value="400" x="960" y="440" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">400</text>
      <!-- x = 160 + 2·ms over a 0–400 domain. Category y is a label rail.
           scripts/verify-box-plot.py derives the value scale from the
           declared five-number summaries and flags any mark that disagrees. -->
      <g data-name="Auth" data-q1="18" data-q2="22" data-q3="28" data-wlo="12" data-whi="40">
        <line data-role="whisker-lo" x1="184" y1="80" x2="196" y2="80" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="whisker-hi" x1="216" y1="80" x2="240" y2="80" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="cap" x1="184" y1="72" x2="184" y2="88" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="cap" x1="240" y1="72" x2="240" y2="88" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <rect x="196" y="64.0" width="20" height="32" rx="2" fill="#2d3142"/>
        <rect data-role="box" x="196" y="64.0" width="20" height="32" rx="2" fill="rgba(245,245,245,0.14)" stroke="#bfc0c0" stroke-width="1"/>
        <line data-role="median" x1="204" y1="64.0" x2="204" y2="96.0" stroke="#f5f5f5" stroke-width="1.5"/>
        <text data-name="Auth" x="148" y="84" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Auth</text>
      </g>
      <g data-name="Catalog" data-q1="30" data-q2="46" data-q3="70" data-wlo="16" data-whi="90">
        <line data-role="whisker-lo" x1="192" y1="148" x2="220" y2="148" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="whisker-hi" x1="300" y1="148" x2="340" y2="148" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="cap" x1="192" y1="140" x2="192" y2="156" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="cap" x1="340" y1="140" x2="340" y2="156" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <rect x="220" y="132.0" width="80" height="32" rx="2" fill="#2d3142"/>
        <rect data-role="box" x="220" y="132.0" width="80" height="32" rx="2" fill="rgba(245,245,245,0.14)" stroke="#bfc0c0" stroke-width="1"/>
        <line data-role="median" x1="252" y1="132.0" x2="252" y2="164.0" stroke="#f5f5f5" stroke-width="1.5"/>
        <text data-name="Catalog" x="148" y="152" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Catalog</text>
      </g>
      <g data-name="Checkout" data-q1="80" data-q2="120" data-q3="200" data-wlo="40" data-whi="280">
        <line data-role="whisker-lo" x1="240" y1="216" x2="320" y2="216" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="whisker-hi" x1="560" y1="216" x2="720" y2="216" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="cap" x1="240" y1="208" x2="240" y2="224" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="cap" x1="720" y1="208" x2="720" y2="224" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <rect x="320" y="200.0" width="240" height="32" rx="2" fill="#2d3142"/>
        <rect data-role="box" x="320" y="200.0" width="240" height="32" rx="2" fill="rgba(240,138,89,0.18)" stroke="#f08a59" stroke-width="1.2"/>
        <line data-role="median" x1="400" y1="200.0" x2="400" y2="232.0" stroke="#f5f5f5" stroke-width="1.5"/>
        <circle cx="936" cy="216" r="4" fill="#2d3142"/>
        <circle data-outlier="Checkout" data-x="388" cx="936" cy="216" r="4" fill="rgba(240,138,89,0.55)" stroke="#f08a59" stroke-width="0.75"/>
        <circle cx="952" cy="216" r="4" fill="#2d3142"/>
        <circle data-outlier="Checkout" data-x="396" cx="952" cy="216" r="4" fill="rgba(240,138,89,0.55)" stroke="#f08a59" stroke-width="0.75"/>
        <text data-name="Checkout" x="148" y="220" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Checkout</text>
      </g>
      <g data-name="Search" data-q1="22" data-q2="28" data-q3="40" data-wlo="8" data-whi="64">
        <line data-role="whisker-lo" x1="176" y1="284" x2="204" y2="284" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="whisker-hi" x1="240" y1="284" x2="288" y2="284" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="cap" x1="176" y1="276" x2="176" y2="292" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="cap" x1="288" y1="276" x2="288" y2="292" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <rect x="204" y="268.0" width="36" height="32" rx="2" fill="#2d3142"/>
        <rect data-role="box" x="204" y="268.0" width="36" height="32" rx="2" fill="rgba(245,245,245,0.14)" stroke="#bfc0c0" stroke-width="1"/>
        <line data-role="median" x1="216" y1="268.0" x2="216" y2="300.0" stroke="#f5f5f5" stroke-width="1.5"/>
        <text data-name="Search" x="148" y="288" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Search</text>
      </g>
      <g data-name="Billing" data-q1="36" data-q2="42" data-q3="50" data-wlo="20" data-whi="70">
        <line data-role="whisker-lo" x1="200" y1="352" x2="232" y2="352" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="whisker-hi" x1="260" y1="352" x2="300" y2="352" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="cap" x1="200" y1="344" x2="200" y2="360" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <line data-role="cap" x1="300" y1="344" x2="300" y2="360" stroke="rgba(245,245,245,0.40)" stroke-width="1"/>
        <rect x="232" y="336.0" width="28" height="32" rx="2" fill="#2d3142"/>
        <rect data-role="box" x="232" y="336.0" width="28" height="32" rx="2" fill="rgba(245,245,245,0.14)" stroke="#bfc0c0" stroke-width="1"/>
        <line data-role="median" x1="244" y1="336.0" x2="244" y2="368.0" stroke="#f5f5f5" stroke-width="1.5"/>
        <circle cx="352" cy="352" r="4" fill="#2d3142"/>
        <circle data-outlier="Billing" data-x="96" cx="352" cy="352" r="4" fill="rgba(245,245,245,0.55)" stroke="#bfc0c0" stroke-width="0.75"/>
        <text data-name="Billing" x="148" y="356" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Billing</text>
      </g>
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="478" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <text x="960" y="478" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="end">BOX = IQR · LINE = MEDIAN · DOT = OUTLIER</text>
      <rect x="44" y="484" width="16" height="10" rx="2" fill="rgba(240,138,89,0.18)" stroke="#f08a59" stroke-width="1.2"/>
      <text x="68" y="494" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Checkout · focal, the IQR that will page</text>
      <rect x="360" y="484" width="16" height="10" rx="2" fill="rgba(245,245,245,0.14)" stroke="#bfc0c0" stroke-width="1"/>
      <text x="384" y="494" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">service · box is q1–q3, whisker to the last inlier</text>
    </svg>
  </div>
</body>
</html>
