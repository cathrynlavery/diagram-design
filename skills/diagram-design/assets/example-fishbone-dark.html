<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout p99 latency · Root-cause fishbone</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1080px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Fishbone · Diagram Design</p>
    <h1>Checkout p99 latency · Root-cause fishbone</h1>

    <svg viewBox="-40 0 1480 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fishbone-dark-title fishbone-dark-desc">
      <title id="fishbone-dark-title">Checkout p99 latency · Root-cause fishbone</title>
      <desc id="fishbone-dark-desc">Fishbone diagram tracing a checkout latency incident to five candidate cause categories, with a missing database index under Data confirmed as the root cause.</desc>
      <defs>
        <marker id="fishbone-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f5f5f5"/>
        </marker>
      </defs>

      <rect x="-40" y="0" width="1480" height="600" fill="#2d3142"/>

      <!-- Spine -->
      <line x1="120" y1="320" x2="1200" y2="320" stroke="#f5f5f5" stroke-width="1.2" marker-end="url(#fishbone-arrow)"/>

      <!-- Bones -->
      <line x1="880" y1="320" x2="784" y2="152" stroke="#f5f5f5" stroke-width="1.2"/>
      <line x1="720" y1="320" x2="624" y2="488" stroke="#f08a59" stroke-width="1.2"/>
      <line x1="560" y1="320" x2="464" y2="152" stroke="#f5f5f5" stroke-width="1.2"/>
      <line x1="400" y1="320" x2="304" y2="488" stroke="#f5f5f5" stroke-width="1.2"/>
      <line x1="240" y1="320" x2="144" y2="152" stroke="#f5f5f5" stroke-width="1.2"/>

      <!-- Sub-cause ticks + labels · Deploy -->
      <line x1="848" y1="264" x2="816" y2="264" stroke="#bfc0c0" stroke-width="1"/>
      <text x="812" y="260" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">canary skipped</text>
      <line x1="816" y1="208" x2="784" y2="208" stroke="#bfc0c0" stroke-width="1"/>
      <text x="780" y="204" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">config drift</text>

      <!-- Sub-cause ticks + labels · Data (root cause) -->
      <line x1="688" y1="376" x2="656" y2="376" stroke="#bfc0c0" stroke-width="1"/>
      <text x="652" y="388" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">index missing on orders.created_at</text>
      <line x1="656" y1="432" x2="624" y2="432" stroke="#bfc0c0" stroke-width="1"/>
      <text x="620" y="444" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">table 3x forecast</text>

      <!-- Sub-cause ticks + labels · Runtime -->
      <line x1="528" y1="264" x2="496" y2="264" stroke="#bfc0c0" stroke-width="1"/>
      <text x="492" y="260" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">connection pool cap 20</text>
      <line x1="496" y1="208" x2="464" y2="208" stroke="#bfc0c0" stroke-width="1"/>
      <text x="460" y="204" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">GC pauses</text>

      <!-- Sub-cause ticks + labels · Observability -->
      <line x1="368" y1="376" x2="336" y2="376" stroke="#bfc0c0" stroke-width="1"/>
      <text x="332" y="388" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">no p99 alert</text>
      <line x1="336" y1="432" x2="304" y2="432" stroke="#bfc0c0" stroke-width="1"/>
      <text x="300" y="444" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">dashboard sampled at 5m</text>

      <!-- Sub-cause tick + label · People -->
      <line x1="192" y1="236" x2="160" y2="236" stroke="#bfc0c0" stroke-width="1"/>
      <text x="156" y="232" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">on-call handover mid-incident</text>

      <!-- Category tag boxes -->
      <rect x="724" y="116" width="120" height="28" rx="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="0.8"/>
      <text x="784" y="134" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DEPLOY</text>

      <rect x="564" y="496" width="120" height="28" rx="4" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/>
      <text x="624" y="514" fill="#f08a59" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DATA</text>

      <rect x="404" y="116" width="120" height="28" rx="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="0.8"/>
      <text x="464" y="134" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RUNTIME</text>

      <rect x="244" y="496" width="120" height="28" rx="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="0.8"/>
      <text x="304" y="514" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OBSERVABILITY</text>

      <rect x="84" y="116" width="120" height="28" rx="4" fill="#2d3142" stroke="#f5f5f5" stroke-width="0.8"/>
      <text x="144" y="134" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PEOPLE</text>

      <!-- Effect box -->
      <rect x="1200" y="272" width="200" height="96" rx="6" fill="#2d3142"/>
      <rect x="1200" y="272" width="200" height="96" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <rect x="1208" y="280" width="48" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.40)" stroke-width="0.8"/>
      <text x="1232" y="289" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EFFECT</text>
      <text x="1300" y="324" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Checkout p99 latency</text>
      <text x="1300" y="340" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4x for 90 minutes</text>

      <!-- Legend -->
      <line x1="40" y1="560" x2="1400" y2="560" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="576" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="40" y1="588" x2="56" y2="588" stroke="#f5f5f5" stroke-width="1.2"/>
      <text x="64" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Category (bone)</text>

      <line x1="260" y1="588" x2="276" y2="588" stroke="#f08a59" stroke-width="1.2"/>
      <text x="284" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Confirmed root cause</text>

      <line x1="480" y1="588" x2="496" y2="588" stroke="#bfc0c0" stroke-width="1"/>
      <text x="504" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Sub-cause</text>

      <rect x="700" y="584" width="16" height="8" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="724" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Observed effect</text>
    </svg>
  </div>
</body>
</html>
