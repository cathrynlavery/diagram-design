<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Response time distribution · Histogram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Histogram · Diagram Design</p>
    <h1>Most requests are faster than the average</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="histogram-dark-title histogram-dark-desc">
      <title id="histogram-dark-title">Most requests are faster than the average</title>
      <desc id="histogram-dark-desc">Histogram of 550 request response times in ten equal 100-millisecond bins from 0 to 1000; the modal bin is 200 to 300 milliseconds, and the long right tail pulls the mean to 319 milliseconds, to the right of the mode.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Axis captions -->
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">REQUESTS</text>
      <text x="520" y="452" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">RESPONSE TIME, MS</text>

      <!-- Horizontal gridlines (drawn before bars). The count scale is linear:
           2.375px per request over a 0-160 domain, and every tick below sits
           where that one scale puts it - scripts/verify-histogram.py checks the
           ticks against the same scale it fits to the bars. -->
      <line x1="80" y1="325" x2="960" y2="325" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="230" x2="960" y2="230" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="135" x2="960" y2="135" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(245,245,245,0.06)" stroke-width="0.8"/>

      <!-- Y-axis line and X-axis baseline. The baseline IS count zero: a
           histogram reads mass by area, so the count axis never truncates. -->
      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(245,245,245,0.20)" stroke-width="1"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(245,245,245,0.20)" stroke-width="1"/>

      <!-- Y-axis tick labels, bound to the counts they print -->
      <text data-count-tick="0"   x="72" y="424" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0</text>
      <text data-count-tick="40"  x="72" y="329" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">40</text>
      <text data-count-tick="80"  x="72" y="234" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">80</text>
      <text data-count-tick="120" x="72" y="139" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">120</text>
      <text data-count-tick="160" x="72" y="44"  fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">160</text>

      <!-- ─── BINS (10 × 100ms over 0-1000ms; 88px per bin, edges shared,
           no gap - contiguous bars are what say "one continuous variable",
           and the gap is what says "categories" in the parent chart).
           Every paper mask is painted before any bar body: a per-bar mask
           painted later would erase half of its neighbour's shared 1px edge,
           thinning the boundary this variant exists to keep. ─── -->
      <rect x="80" y="377.25" width="88" height="42.75" fill="#2d3142"/>
      <rect x="168" y="106.5" width="88" height="313.5" fill="#2d3142"/>
      <rect x="256" y="49.5" width="88" height="370.5" fill="#2d3142"/>
      <rect x="344" y="177.75" width="88" height="242.25" fill="#2d3142"/>
      <rect x="432" y="275.12" width="88" height="144.88" fill="#2d3142"/>
      <rect x="520" y="334.5" width="88" height="85.5" fill="#2d3142"/>
      <rect x="608" y="367.75" width="88" height="52.25" fill="#2d3142"/>
      <rect x="696" y="389.12" width="88" height="30.88" fill="#2d3142"/>
      <rect x="784" y="403.38" width="88" height="16.62" fill="#2d3142"/>
      <rect x="872" y="412.88" width="88" height="7.12" fill="#2d3142"/>

      <!-- 0-100: n=18, h=42.75, y=377.25 -->
      <rect data-bin-start="0" data-bin-end="100" data-count="18" x="80" y="377.25" width="88" height="42.75" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
      <text data-bin-start="0" data-role="count" x="124" y="369.25" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">18</text>

      <!-- 100-200: n=132, h=313.5, y=106.5 -->
      <rect data-bin-start="100" data-bin-end="200" data-count="132" x="168" y="106.5" width="88" height="313.5" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
      <text data-bin-start="100" data-role="count" x="212" y="98.5" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">132</text>

      <!-- 200-300 FOCAL, the modal bin: n=156, h=370.5, y=49.5 -->
      <rect data-bin-start="200" data-bin-end="300" data-count="156" x="256" y="49.5" width="88" height="370.5" fill="rgba(240,138,89,0.14)" stroke="#f08a59" stroke-width="1"/>
      <text data-bin-start="200" data-role="count" x="300" y="41.5" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">156</text>

      <!-- 300-400: n=102, h=242.25, y=177.75 -->
      <rect data-bin-start="300" data-bin-end="400" data-count="102" x="344" y="177.75" width="88" height="242.25" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
      <text data-bin-start="300" data-role="count" x="388" y="169.75" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">102</text>

      <!-- 400-500: n=61, h=144.88, y=275.12 -->
      <rect data-bin-start="400" data-bin-end="500" data-count="61" x="432" y="275.12" width="88" height="144.88" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
      <text data-bin-start="400" data-role="count" x="476" y="267.12" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">61</text>

      <!-- 500-600: n=36, h=85.5, y=334.5 -->
      <rect data-bin-start="500" data-bin-end="600" data-count="36" x="520" y="334.5" width="88" height="85.5" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
      <text data-bin-start="500" data-role="count" x="564" y="326.5" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">36</text>

      <!-- 600-700: n=22, h=52.25, y=367.75 -->
      <rect data-bin-start="600" data-bin-end="700" data-count="22" x="608" y="367.75" width="88" height="52.25" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
      <text data-bin-start="600" data-role="count" x="652" y="359.75" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">22</text>

      <!-- 700-800: n=13, h=30.88, y=389.12 -->
      <rect data-bin-start="700" data-bin-end="800" data-count="13" x="696" y="389.12" width="88" height="30.88" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
      <text data-bin-start="700" data-role="count" x="740" y="381.12" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">13</text>

      <!-- 800-900: n=7, h=16.62, y=403.38 -->
      <rect data-bin-start="800" data-bin-end="900" data-count="7" x="784" y="403.38" width="88" height="16.62" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
      <text data-bin-start="800" data-role="count" x="828" y="395.38" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">7</text>

      <!-- 900-1000: n=3, h=7.12, y=412.88 -->
      <rect data-bin-start="900" data-bin-end="1000" data-count="3" x="872" y="412.88" width="88" height="7.12" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
      <text data-bin-start="900" data-role="count" x="916" y="404.88" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>

      <!-- Bin-edge tick labels: a histogram labels EDGES, not bar centres -
           the numbers name the boundaries of intervals, not categories. -->
      <text data-edge="0"    x="80"  y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>
      <text data-edge="100"  x="168" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">100</text>
      <text data-edge="200"  x="256" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200</text>
      <text data-edge="300"  x="344" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">300</text>
      <text data-edge="400"  x="432" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">400</text>
      <text data-edge="500"  x="520" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">500</text>
      <text data-edge="600"  x="608" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">600</text>
      <text data-edge="700"  x="696" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">700</text>
      <text data-edge="800"  x="784" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">800</text>
      <text data-edge="900"  x="872" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">900</text>
      <text data-edge="1000" x="960" y="436" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1000</text>

      <!-- Mean of the binned values, drawn where the x-scale puts 319ms.
           It lands right of the modal bin - that distance is the figure's
           claim, so the marker's position is verified against its value. -->
      <line data-marker="mean" data-value="319" x1="360.72" y1="56" x2="360.72" y2="420" stroke="rgba(245,245,245,0.40)" stroke-width="1" stroke-dasharray="4 3"/>
      <text data-marker-label="mean" data-value="319" x="366.72" y="50" fill="#f5f5f5" font-size="8" font-weight="600" font-family="'Geist Mono', monospace">MEAN 319ms</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="478" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="488" width="16" height="10" rx="2" fill="rgba(240,138,89,0.14)" stroke="#f08a59" stroke-width="1"/>
      <text x="64" y="497" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Modal bin · 200–300ms</text>

      <rect x="220" y="488" width="16" height="10" rx="2" fill="rgba(191,192,192,0.15)" stroke="#bfc0c0" stroke-width="1"/>
      <text x="244" y="497" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Other bins</text>

      <line x1="400" y1="493" x2="424" y2="493" stroke="rgba(245,245,245,0.40)" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="432" y="497" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Mean of the binned values · 319ms</text>

      <text data-role="n" data-value="550" x="960" y="497" fill="#bfc0c0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">n = 550</text>
    </svg>
  </div>
</body>
</html>
