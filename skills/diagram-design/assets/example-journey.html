<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trial to paid: the first week · User journey map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">User journey · Diagram Design</p>
    <h1>Trial to paid: the first week</h1>

    <svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="journey-title journey-desc">
      <title id="journey-title">Trial to paid: the first week</title>
      <desc id="journey-desc">User journey map of a new trial user across five stages, showing actions, touchpoints, and a sentiment curve that dips at the usage-limit stage before recovering at upgrade.</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Stage headers -->
      <text x="164"  y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 1</text>
      <text x="164"  y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sign up</text>

      <text x="388"  y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 2</text>
      <text x="388"  y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">First run</text>

      <text x="612"  y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 3</text>
      <text x="612"  y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Invite team</text>

      <text x="836"  y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 4</text>
      <text x="836"  y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hit the limit</text>

      <text x="1060" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 5</text>
      <text x="1060" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Upgrade</text>

      <!-- Sentiment band: reference hairlines -->
      <line x1="64" y1="100" x2="1160" y2="100" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="180" x2="1160" y2="180" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="260" x2="1160" y2="260" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">HIGH</text>
      <text x="56" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">NEUTRAL</text>
      <text x="56" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.10em">LOW</text>

      <!-- Sentiment curve (data curve — not a connector, §6 rule 1 exempt) -->
      <polyline points="164,100 388,180 612,100" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="612,100 836,260" fill="none" stroke="#eb6c36" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="836,260 1060,180" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linejoin="round"/>

      <circle cx="164"  cy="100" r="5" fill="#4f5d75"/>
      <circle cx="388"  cy="180" r="5" fill="#4f5d75"/>
      <circle cx="612"  cy="100" r="5" fill="#4f5d75"/>
      <circle cx="836"  cy="260" r="5" fill="#eb6c36"/>
      <circle cx="1060" cy="180" r="5" fill="#4f5d75"/>

      <!-- Row separators (full plot width) -->
      <line x1="64" y1="280" x2="1160" y2="280" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="376" x2="1160" y2="376" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <!-- Row labels -->
      <text x="56" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">ACTIONS</text>
      <text x="72" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">TOUCHPOINTS</text>

      <!-- Actions -->
      <text x="164"  y="300" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Create workspace</text>
      <text x="388"  y="300" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Import first dataset</text>
      <text x="612"  y="300" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Add 3 teammates</text>
      <text x="836"  y="300" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Export blocked mid-report</text>
      <text x="1060" y="300" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Pick annual plan</text>

      <!-- Pain markers (Hit the limit only) -->
      <rect x="744" y="312" width="184" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="836" y="324" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">NO WARNING AT 80%</text>

      <rect x="744" y="332" width="184" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="836" y="344" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">PRICING PAGE IS 3 CLICKS AWAY</text>

      <!-- Touchpoints -->
      <text x="164"  y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">signup form</text>
      <text x="388"  y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">onboarding wizard</text>
      <text x="612"  y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">email invite</text>
      <text x="836"  y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in-app modal</text>
      <text x="1060" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">billing page</text>

      <!-- Legend -->
      <line x1="40" y1="464" x2="1160" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="40" y1="496" x2="56" y2="496" stroke="#4f5d75" stroke-width="1.5"/>
      <circle cx="48" cy="496" r="3" fill="#4f5d75"/>
      <text x="64" y="500" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sentiment curve</text>

      <line x1="220" y1="496" x2="236" y2="496" stroke="#eb6c36" stroke-width="1.5"/>
      <circle cx="228" cy="496" r="3" fill="#eb6c36"/>
      <text x="244" y="500" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Trough stage</text>

      <rect x="384" y="492" width="16" height="8" rx="2" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="408" y="500" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Pain marker</text>
    </svg>
  </div>
</body>
</html>
