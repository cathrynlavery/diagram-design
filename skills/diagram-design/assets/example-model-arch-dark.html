      <desc id="model-arch-dark-desc">Model architecture diagram of a 40-layer causal encoder-decoder language model drawn as seventeen blocks. The encoder is two sliding-window layers, then three repeats of one full sparse-attention layer followed by five reuse layers; the decoder is one full layer, three reuse layers, then four repeats of a reindex layer followed by three reuse layers. Every layer ends in a mixture-of-experts feed-forward block, an n-gram memory module feeds two encoder layers, and the encoder output projects the global key-value cache that every decoder layer reads.</desc>
