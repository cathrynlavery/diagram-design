<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout service · Deployment</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · Diagram Design</p>
    <h1>Checkout service, production</h1>

    <svg viewBox="0 0 1040 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-dark-title deployment-dark-desc">
      <title id="deployment-dark-title">Checkout service, production</title>
      <desc id="deployment-dark-desc">Deployment diagram placing the checkout service across an edge CDN zone, a production Kubernetes zone running ingress and API pods, and a data zone with a primary Postgres instance replicating to a standby.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zones (drawn first, before arrows and nodes) -->
      <rect x="40" y="40" width="208" height="280" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="56" y="44" width="48" height="12" fill="#2d3142"/>
      <text x="80" y="53" fill="rgba(245,245,245,0.35)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EDGE</text>

      <rect x="280" y="40" width="280" height="280" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="296" y="44" width="140" height="12" fill="#2d3142"/>
      <text x="366" y="53" fill="rgba(245,245,245,0.35)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PROD / EU-WEST-1</text>

      <rect x="600" y="40" width="240" height="280" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="616" y="44" width="40" height="12" fill="#2d3142"/>
      <text x="636" y="53" fill="rgba(245,245,245,0.35)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA</text>

      <!-- Network paths (behind nodes) -->
      <path d="M 224,196 H 288 Q 296,196 296,188 V 128 Q 296,120 304,120" fill="none" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="420" y1="164" x2="420" y2="196" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 536,252 H 572 Q 580,252 580,244 V 128 Q 580,120 588,120 H 624" fill="none" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="720" y1="164" x2="720" y2="212" stroke="#f08a59" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- Path labels -->
      <rect x="224" y="176" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="256" y="185" fill="#6a95d8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS:443</text>

      <rect x="428" y="174" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="460" y="183" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP:8080</text>

      <rect x="588" y="180" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="620" y="189" fill="#6a95d8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TLS:5432</text>

      <rect x="728" y="182" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="764" y="191" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAL STREAM</text>

      <!-- Node: CDN (edge-cache) -->
      <rect x="64" y="156" width="160" height="84" rx="6" fill="#2d3142"/>
      <rect x="64" y="156" width="160" height="84" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <rect x="72" y="164" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
      <text x="88" y="173" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDN</text>
      <text x="144" y="196" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloudflare</text>
      <rect x="72" y="208" width="144" height="24" rx="4" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="80" y="224" fill="#f5f5f5" font-size="12" font-family="'Geist', sans-serif">edge-cache</text>
      <text x="208" y="224" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v1.2</text>

      <!-- Node: ingress -->
      <rect x="304" y="80" width="232" height="84" rx="6" fill="#2d3142"/>
      <rect x="304" y="80" width="232" height="84" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="312" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="328" y="97" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
      <text x="420" y="120" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ingress</text>
      <rect x="312" y="132" width="216" height="24" rx="4" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="320" y="148" fill="#f5f5f5" font-size="12" font-family="'Geist', sans-serif">nginx-ingress</text>
      <text x="520" y="148" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v1.11</text>

      <!-- Node: app (replica x3) -->
      <rect x="304" y="196" width="232" height="116" rx="6" fill="#2d3142"/>
      <rect x="304" y="196" width="232" height="116" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="312" y="204" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="328" y="213" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
      <rect x="500" y="204" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
      <text x="514" y="213" fill="#f5f5f5" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">x3</text>
      <text x="420" y="236" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">app</text>
      <rect x="312" y="248" width="216" height="24" rx="4" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="320" y="264" fill="#f5f5f5" font-size="12" font-family="'Geist', sans-serif">checkout-api</text>
      <text x="520" y="264" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v2.4.1</text>
      <rect x="312" y="280" width="216" height="24" rx="4" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="320" y="296" fill="#f5f5f5" font-size="12" font-family="'Geist', sans-serif">sidecar-otel</text>
      <text x="520" y="296" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v0.9</text>

      <!-- Node: rds-primary (focal) -->
      <rect x="624" y="80" width="192" height="84" rx="6" fill="#2d3142"/>
      <rect x="624" y="80" width="192" height="84" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <rect x="632" y="88" width="64" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
      <text x="664" y="97" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
      <text x="720" y="120" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rds-primary</text>
      <rect x="632" y="132" width="176" height="24" rx="4" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="640" y="148" fill="#f5f5f5" font-size="12" font-family="'Geist', sans-serif">postgres</text>
      <text x="800" y="148" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">16.2</text>

      <!-- Node: rds-standby -->
      <rect x="624" y="212" width="192" height="84" rx="6" fill="#2d3142"/>
      <rect x="624" y="212" width="192" height="84" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <rect x="632" y="220" width="64" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"/>
      <text x="664" y="229" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
      <text x="720" y="252" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rds-standby</text>
      <rect x="632" y="264" width="176" height="24" rx="4" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="640" y="280" fill="#f5f5f5" font-size="12" font-family="'Geist', sans-serif">postgres</text>
      <text x="800" y="280" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">16.2</text>

      <!-- Legend strip -->
      <line x1="40" y1="340" x2="1000" y2="340" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="356" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="372" width="14" height="10" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
      <text x="60" y="380" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Focal / primary</text>

      <rect x="180" y="372" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="200" y="380" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Infra node</text>

      <rect x="320" y="372" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <text x="340" y="380" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Store / standby</text>

      <rect x="460" y="372" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="480" y="380" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Managed / CDN</text>

      <line x1="600" y1="376" x2="628" y2="376" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="636" y="380" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Cross-zone</text>

      <line x1="740" y1="376" x2="768" y2="376" stroke="#f08a59" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="776" y="380" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Replication</text>

      <line x1="880" y1="376" x2="908" y2="376" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="916" y="380" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">In-zone call</text>
    </svg>
  </div>
</body>
</html>
