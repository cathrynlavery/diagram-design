    <h1>The median hides the tail</h1>

    <!-- Value axis: 0-440ms over 880px, x = 80 + 2*ms, linear from zero.
         The vertical (swarm) axis carries NO meaning: each dot's y offset is
         greedy packing at pitch 10 (2r+2) around the y=230 midline, first
         free slot alternating above/below, and overlap is never resolved by
         moving a dot along the value axis. scripts/verify-beeswarm.py derives
         the value scale from the dots themselves and flags any dot that
         disagrees with its peers, any overlapping pair, and any second dot
         radius or non-focal fill. -->
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="beeswarm-dark-title beeswarm-dark-desc">
      <title id="beeswarm-dark-title">The median hides the tail</title>
      <desc id="beeswarm-dark-desc">Beeswarm of 138 per-request latency samples for one checkout endpoint on a shared linear value axis from zero; vertical spread is packing only and carries no value, and three requests past 380 ms form the p99 tail.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Axis caption -->
      <text x="520" y="492" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">PER-REQUEST LATENCY, MS</text>

      <!-- Vertical gridlines only: the swarm axis has no scale to grid.
           A horizontal rule through the band would invite reading the
           packing offsets as values, which they are not. -->
      <line x1="280" y1="40" x2="280" y2="420" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>
      <line x1="480" y1="40" x2="480" y2="420" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>
      <line x1="680" y1="40" x2="680" y2="420" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>
      <line x1="880" y1="40" x2="880" y2="420" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>

      <!-- Value axis, from zero. -->
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(245,245,245,0.25)" stroke-width="1"/>

      <!-- Tick labels are BOUND: data-tick names the (one) value axis and
           data-value the number the tick claims to sit at. verify-beeswarm.py
           cross-checks each against the scale the dots themselves describe. -->
      <text data-tick="x" data-value="0" x="80" y="440" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>
      <text data-tick="x" data-value="100" x="280" y="440" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">100</text>

      <text data-tick="x" data-value="400" x="880" y="440" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">400</text>
