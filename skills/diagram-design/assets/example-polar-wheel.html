<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform team · Skill wheel</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Polar wheel · Diagram Design</p>
    <h1>Platform team · Skill wheel</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="polar-wheel-title polar-wheel-desc">
      <title id="polar-wheel-title">Platform team · Skill wheel</title>
      <desc id="polar-wheel-desc">Polar wheel of six platform-team competencies where radius shows strength, with individual team members placed by skill and level.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Concentric reference rings (25 / 50 / 75 / 100) -->
        <circle cx="500" cy="276" r="48"  fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <circle cx="500" cy="276" r="96"  fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <circle cx="500" cy="276" r="144" fill="none" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <circle cx="500" cy="276" r="192" fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

        <!-- Radial spokes at sector boundaries -->
        <line x1="500" y1="276" x2="500" y2="84"   stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <line x1="500" y1="276" x2="666" y2="180"  stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <line x1="500" y1="276" x2="666" y2="372"  stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <line x1="500" y1="276" x2="500" y2="468"  stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <line x1="500" y1="276" x2="334" y2="372"  stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
        <line x1="500" y1="276" x2="334" y2="180"  stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

        <!-- Sector bands — radius is magnitude (value / 100 × 192) -->
        <!-- Frontend · series-1 sage · 72 -->
        <path d="M 476 234 A 48 48 0 0 1 524 234 L 569 156 A 138 138 0 0 0 431 156 Z" fill="rgba(124,143,111,0.18)" stroke="#7c8f6f" stroke-width="1.2"/>
        <!-- Data · series-2 dusty-blue · 56 -->
        <path d="M 548 276 A 48 48 0 0 1 524 318 L 554 370 A 108 108 0 0 0 608 276 Z" fill="rgba(94,122,155,0.18)" stroke="#5e7a9b" stroke-width="1.2"/>
        <!-- DevOps · series-3 mustard · 64 -->
        <path d="M 524 318 A 48 48 0 0 1 476 318 L 438 383 A 123 123 0 0 0 562 383 Z" fill="rgba(184,145,90,0.18)" stroke="#b8915a" stroke-width="1.2"/>
        <!-- UX · series-4 rust-brown · 40 -->
        <path d="M 476 318 A 48 48 0 0 1 452 276 L 423 276 A 77 77 0 0 0 462 343 Z" fill="rgba(156,107,80,0.18)" stroke="#9c6b50" stroke-width="1.2"/>
        <!-- QA · series-5 slate · 48 -->
        <path d="M 452 276 A 48 48 0 0 1 476 234 L 454 196 A 92 92 0 0 0 408 276 Z" fill="rgba(110,100,121,0.18)" stroke="#6e6479" stroke-width="1.2"/>
        <!-- Backend · accent · 88 (focal) -->
        <path d="M 524 234 A 48 48 0 0 1 548 276 L 669 276 A 169 169 0 0 0 584 130 Z" fill="rgba(235,108,54,0.18)" stroke="#eb6c36" stroke-width="1.4"/>

        <!-- Value labels at bar tips (masked) -->
        <rect x="488" y="111" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="122" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">72</text>
        <rect x="595" y="327" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="607" y="338" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">56</text>
        <rect x="488" y="404" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="415" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">64</text>
        <rect x="407" y="311" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="419" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">40</text>
        <rect x="394" y="211" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="406" y="222" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">48</text>
        <rect x="648" y="173" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="660" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">88</text>

        <!-- Team members at (angle, radius) — paper mask + dot -->
        <circle cx="531" cy="152" r="5" fill="#f5f5f5"/>
        <circle cx="531" cy="152" r="5" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
        <circle cx="569" cy="343" r="5" fill="#f5f5f5"/>
        <circle cx="569" cy="343" r="5" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
        <circle cx="419" cy="253" r="5" fill="#f5f5f5"/>
        <circle cx="419" cy="253" r="5" fill="rgba(79,93,117,0.20)" stroke="#4f5d75" stroke-width="1"/>
        <!-- Senior member in the focal sector -->
        <circle cx="615" cy="165" r="6" fill="#f5f5f5"/>
        <circle cx="615" cy="165" r="6" fill="#eb6c36"/>

        <!-- Tangent-rotated rim labels (flipped on the bottom half) -->
        <text x="500" y="56"  fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" transform="rotate(0 500 56)">Frontend</text>
        <text x="691" y="166" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" transform="rotate(60 691 166)">Backend</text>
        <text x="691" y="386" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" transform="rotate(-60 691 386)">Data</text>
        <text x="500" y="496" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" transform="rotate(0 500 496)">DevOps</text>
        <text x="309" y="386" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" transform="rotate(60 309 386)">UX</text>
        <text x="309" y="166" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" transform="rotate(300 309 166)">QA</text>

        <!-- Legend -->
        <line x1="40" y1="508" x2="960" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40"  y="532" width="16" height="8" fill="rgba(235,108,54,0.18)" stroke="#eb6c36" stroke-width="1.4"/>
        <text x="64"  y="540" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Backend · focal</text>

        <rect x="168" y="532" width="16" height="8" fill="rgba(124,143,111,0.18)" stroke="#7c8f6f" stroke-width="1.2"/>
        <text x="192" y="540" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Frontend</text>

        <rect x="296" y="532" width="16" height="8" fill="rgba(94,122,155,0.18)" stroke="#5e7a9b" stroke-width="1.2"/>
        <text x="320" y="540" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Data</text>

        <rect x="424" y="532" width="16" height="8" fill="rgba(184,145,90,0.18)" stroke="#b8915a" stroke-width="1.2"/>
        <text x="448" y="540" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">DevOps</text>

        <rect x="552" y="532" width="16" height="8" fill="rgba(156,107,80,0.18)" stroke="#9c6b50" stroke-width="1.2"/>
        <text x="576" y="540" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">UX</text>

        <rect x="680" y="532" width="16" height="8" fill="rgba(110,100,121,0.18)" stroke="#6e6479" stroke-width="1.2"/>
        <text x="704" y="540" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">QA</text>

        <circle cx="44" cy="552" r="3" fill="#4f5d75"/>
        <text x="52" y="556" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">team member</text>

        <circle cx="196" cy="552" r="3" fill="#eb6c36"/>
        <text x="204" y="556" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">senior · focal</text>
      </svg>
  </div>
</body>
</html>
