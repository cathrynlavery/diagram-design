<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagram Design · Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --paper: #f5f4ed;
        --paper-2: #efeee5;
        --ink: #0b0d0b;
        --muted: #52534e;
        --soft: #65655c;
        --rule: rgba(11, 13, 11, 0.12);
        --rule-strong: rgba(11, 13, 11, 0.25);
        --accent: #f7591f;
        --sans: "Geist", system-ui, sans-serif;
        --serif: "Instrument Serif", serif;
        --mono: "Geist Mono", ui-monospace, monospace;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--sans);
        background: var(--paper);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .topbar {
        padding: 0.875rem 1.25rem;
        border-bottom: 1px solid var(--rule);
        flex: 0 0 auto;
      }
      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.625rem;
        gap: 1rem;
      }
      .title-row h1 {
        font-family: var(--serif);
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1;
      }
      .title-row .meta {
        font-family: var(--mono);
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .title-row .open-raw {
        font-family: var(--mono);
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        color: var(--muted);
        text-decoration: none;
        padding: 0.3rem 0.625rem;
        border: 1px solid var(--rule);
        border-radius: 4px;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .open-raw:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        margin-bottom: 0.5rem;
      }
      .tabs.variants {
        margin-bottom: 0;
        padding: 0;
        border: 0;
        flex-wrap: nowrap;
        flex: 0 1 auto;
        gap: 0.25rem;
      }
      .tab {
        font-family: var(--sans);
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.375rem 0.75rem;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--rule);
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.12s;
        letter-spacing: -0.005em;
      }
      .tab:hover {
        color: var(--ink);
        border-color: var(--rule-strong);
      }
      .tab:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .tab.active {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
      }
      .tab .eyebrow {
        display: inline-block;
        margin-right: 0.25rem;
        font-family: var(--mono);
        font-size: 0.6875rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: inherit;
        opacity: 0.5;
      }
      .tab.new::after {
        content: "NEW";
        display: inline-block;
        margin-left: 0.35rem;
        font-family: var(--mono);
        font-size: 0.6875rem;
        letter-spacing: 0.12em;
        color: var(--accent);
        vertical-align: 1px;
      }
      .tab.active.new::after {
        color: var(--paper);
      }

      main {
        flex: 1 1 auto;
        position: relative;
        background: var(--paper-2);
        overflow: hidden;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--paper);
        display: block;
      }

      [hidden] { display: none !important; }
      main { min-height: 0; }
      .brand, .header-actions, .controls, .catalog-tools {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: 0;
      }
      .header-actions { gap: 0.5rem; }
      .nav-toggle { display: inline-flex; align-items: center; gap: 0.5rem; flex: 0 0 auto; }
      .nav-toggle svg { width: 16px; height: 16px; }
      .nav-toggle[aria-expanded="true"] { background: var(--paper-2); color: var(--ink); }
      .controls { justify-content: space-between; gap: 1rem; }
      .current-diagram { font-size: 0.8125rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .catalog { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--rule); }
      .catalog-tools { justify-content: space-between; margin-bottom: 0.625rem; }
      .search-label { display: flex; align-items: center; gap: 0.625rem; font-size: 0.75rem; min-width: 0; }
      #diagram-search {
        width: min(20rem, 45vw);
        padding: 0.5rem 0.625rem;
        border: 1px solid var(--rule-strong);
        border-radius: 4px;
        background: transparent;
        font: 0.8125rem var(--sans);
        color: var(--ink);
        caret-color: var(--accent);
      }
      #diagram-search::placeholder { color: var(--muted); }
      .catalog-hint, .empty-results { font-size: 0.75rem; color: var(--muted); }
      #type-tabs {
        max-height: min(10rem, 22vh);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: var(--rule-strong) var(--paper);
        margin: 0;
        padding: 2px 0.5rem 2px 2px;
      }
      #type-tabs .tab { text-align: left; max-width: 100%; overflow-wrap: anywhere; }
      .empty-results { padding: 0.75rem 0; }
      :is(button, a, input):focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      ::selection { background: var(--ink); color: var(--paper); }
      @media (max-width: 640px) {
        .topbar { padding: 0.75rem; }
        .title-row { flex-wrap: wrap; gap: 0.625rem; }
        .brand { flex: 1 1 auto; }
        .title-row h1 { font-size: 1.35rem; }
        .title-row .meta { display: none; }
        .header-actions { margin-left: auto; }
        .controls { flex-wrap: wrap; gap: 0.5rem; }
        .current-diagram { flex-basis: 100%; }
        .tabs.variants { flex-wrap: wrap; max-width: 100%; }
        .catalog-hint { display: none; }
        .search-label { width: 100%; }
        #diagram-search { flex: 1; width: 0; }
        #type-tabs { max-height: min(8rem, 18vh); }
      }
    </style>
  </head>

    <script>
      const state = { type: "architecture", variant: "" };
      const iframe = document.getElementById("preview");
      const openRaw = document.getElementById("open-raw");

      const nav = document.getElementById("diagram-nav");
      const navToggle = document.getElementById("nav-toggle");
      const search = document.getElementById("diagram-search");
      const typeTabs = [...document.querySelectorAll("#type-tabs .tab")];
      const diagramName = (tab) => [...tab.childNodes]
        .filter((node) => node.nodeType === Node.TEXT_NODE)
        .map((node) => node.textContent).join("").trim();

      function setNavigation(open) {
        nav.hidden = !open;
        navToggle.setAttribute("aria-expanded", String(open));
      }
      navToggle.addEventListener("click", () => setNavigation(nav.hidden));
      nav.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          setNavigation(false);
          navToggle.focus();
        }
      });
      function filterDiagrams() {
        const query = search.value.trim().toLowerCase();
        typeTabs.forEach((tab) => {
          tab.hidden = !diagramName(tab).toLowerCase().includes(query);
        });
        const visible = typeTabs.filter((tab) => !tab.hidden);
        // Keep one visible option reachable with Tab even if selection is filtered out.
        const focusable = visible.find((tab) => tab.dataset.type === state.type) || visible[0];
        typeTabs.forEach((tab) => { tab.tabIndex = tab === focusable ? 0 : -1; });
        document.getElementById("empty-results").hidden = visible.length > 0;
      }
      search.addEventListener("input", filterDiagrams);
      document.querySelector("main").addEventListener("pointerdown", () => setNavigation(false));
      iframe.addEventListener("load", () => {
        try {
          // Iframe events do not bubble to the gallery. Bind after each example load.
          iframe.contentDocument.addEventListener("pointerdown", () => setNavigation(false));
        } catch {
          // Local file previews may have an opaque origin; focus is handled below.
        }
      });
      window.addEventListener("blur", () => {
        if (document.activeElement === iframe) setNavigation(false);
      });

      function update() {
        const activeType = [...document.querySelectorAll("#type-tabs .tab")].find(
          (tab) => tab.dataset.type === state.type,
        );
        const name = diagramName(activeType);
        document.getElementById("current-diagram").textContent = name;
        iframe.title = `${name} preview`;
        const single = activeType && activeType.hasAttribute("data-single");
        const variantTabs = document.querySelectorAll("#variant-tabs .tab");
        if (single) state.variant = "";
        variantTabs.forEach((tab) => {
          tab.disabled = single && tab.dataset.variant !== "";
        });
        for (const [containerId, key] of [
          ["type-tabs", "type"],
          ["variant-tabs", "variant"],
        ]) {
          document.querySelectorAll(`#${containerId} .tab`).forEach((tab) => {
            const active = tab.dataset[key] === state[key];
            tab.classList.toggle("active", active);
            tab.setAttribute("aria-checked", String(active));
            tab.tabIndex = active ? 0 : -1;
          });
        }
        const src = `example-${state.type}${state.variant}.html`;
        iframe.src = src;
        openRaw.href = src;
        filterDiagrams();
        const selectedTabs = document.querySelectorAll('#variant-tabs [role="radio"][aria-checked="true"]');
        iframe.setAttribute(
          "aria-labelledby",
          ["current-diagram", ...[...selectedTabs].map((tab) => tab.id)].join(" "),
        );
      }

      function bindTabs(containerId, key) {
        const container = document.getElementById(containerId);
        const tabs = [...container.querySelectorAll(".tab")];
        tabs.forEach((tab, index) => {
          tab.id = `${containerId}-${index}`;
          tab.setAttribute("role", "radio");
          tab.setAttribute("aria-controls", "preview");
        });

        function activate(tab, focus = false) {
          state[key] = tab.dataset[key];
          update();
          if (focus) tab.focus();
        }

        container.addEventListener("click", (e) => {
          const btn = e.target.closest(".tab");
          if (!btn || btn.disabled) return;
          activate(btn);
        });
        container.addEventListener("keydown", (e) => {
          const current = e.target.closest('[role="radio"]');
          if (!current || !container.contains(current)) return;
          const enabledTabs = tabs.filter((tab) => !tab.disabled && !tab.hidden);
          const index = enabledTabs.indexOf(current);
          let next;
          if (e.key === "ArrowRight" || e.key === "ArrowDown") {
            next = enabledTabs[(index + 1) % enabledTabs.length];
          }
          if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
            next = enabledTabs[(index - 1 + enabledTabs.length) % enabledTabs.length];
          }
          if (e.key === "Home") next = enabledTabs[0];
          if (e.key === "End") next = enabledTabs.at(-1);
          if (!next) return;
          e.preventDefault();
          activate(next, true);
        });
      }

      bindTabs("type-tabs", "type");
      bindTabs("variant-tabs", "variant");
      update();
    </script>
  </body>
</html>
