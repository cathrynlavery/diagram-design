<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Every field has a bit range · Diagram Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#2d3142;color:#f5f5f5;font-family:Geist,system-ui,sans-serif;padding:48px 32px}
.frame{max-width:1200px;margin:0 auto}
.eyebrow{color:#f08a59;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px}
h1{font-family:Instrument Serif,system-ui,sans-serif;font-size:40px;line-height:1.1;margin:0 0 12px}
.subtitle{font-size:20px;line-height:1.4;color:#bfc0c0;margin:0 0 28px}
.canvas{overflow-x:auto}
svg{display:block;width:100%;min-width:1200px}
.cards{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:20px;margin-top:28px}
.cards section{border-top:2px solid #bfc0c0;padding-top:16px}
.cards h2{font-family:Instrument Serif,system-ui,sans-serif;font-size:20px;margin:0 0 8px}
.cards p{font-size:16px;line-height:1.5;color:#bfc0c0;margin:0}
@media(max-width:720px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Packet structure · Diagram Design</p>
<h1>Every field has a bit range</h1>
<p class="subtitle">An illustrative 64-bit frame, arranged in two 32-bit rows.</p>
<div class="canvas">
<svg viewBox="0 0 1200 600" role="img" data-diagram-type="packet-structure" aria-labelledby="packet-structure-dark-title packet-structure-dark-desc">
<title id="packet-structure-dark-title">Illustrative frame</title>
<desc id="packet-structure-dark-desc">Five fields occupy two 32-bit rows.</desc>
<rect width="1200" height="600" fill="#2d3142"/>
<text x="128" y="48" fill="#bfc0c0" font-size="12" font-family="Geist, sans-serif">BIT BOUNDARY / 32 BITS PER ROW</text>
<g data-packet-axis="32" data-packet-source="Illustrative frame schema">
<line data-packet-baseline="true" x1="128" x2="1152" y1="112" y2="112" stroke="#bfc0c0" stroke-width="2"/>
<g data-bit-boundary="0">
<line x1="128" x2="128" y1="104" y2="120" stroke="#bfc0c0" stroke-width="2"/>
<text x="128" y="88" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace" text-anchor="middle">0</text>
</g>
<g data-bit-boundary="8">
<line x1="384" x2="384" y1="104" y2="120" stroke="#bfc0c0" stroke-width="2"/>
<text x="384" y="88" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace" text-anchor="middle">8</text>
</g>
<g data-bit-boundary="16">
<line x1="640" x2="640" y1="104" y2="120" stroke="#bfc0c0" stroke-width="2"/>
<text x="640" y="88" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace" text-anchor="middle">16</text>
</g>
<g data-bit-boundary="24">
<line x1="896" x2="896" y1="104" y2="120" stroke="#bfc0c0" stroke-width="2"/>
<text x="896" y="88" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace" text-anchor="middle">24</text>
</g>
<g data-bit-boundary="32">
<line x1="1152" x2="1152" y1="104" y2="120" stroke="#bfc0c0" stroke-width="2"/>
<text x="1152" y="88" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace" text-anchor="middle">32</text>
</g>
</g>
<g data-packet-row="0">
<text data-packet-row-label="true" x="64" y="216" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace">0</text>
<g data-packet-field="version" data-field-name="Version" data-bit-offset="0" data-bit-width="4">
<rect x="128" y="156" width="128" height="104" fill="#2d3142" stroke="#bfc0c0" stroke-width="2"/>
<text data-packet-label="name" x="140" y="192" fill="#f5f5f5" font-size="16" font-family="Geist, sans-serif">Version</text>
<text data-packet-label="range" x="140" y="232" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace">0–3 / 4b</text>
</g>
<g data-packet-field="flags" data-field-name="Flags" data-bit-offset="4" data-bit-width="4">
<rect x="256" y="156" width="128" height="104" fill="#2d3142" stroke="#bfc0c0" stroke-width="2"/>
<text data-packet-label="name" x="268" y="192" fill="#f5f5f5" font-size="16" font-family="Geist, sans-serif">Flags</text>
<text data-packet-label="range" x="268" y="232" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace">4–7 / 4b</text>
</g>
<g data-packet-field="length" data-field-name="Length" data-bit-offset="8" data-bit-width="16">
<rect x="384" y="156" width="512" height="104" fill="#2d3142" stroke="#bfc0c0" stroke-width="2"/>
<text data-packet-label="name" x="396" y="192" fill="#f5f5f5" font-size="16" font-family="Geist, sans-serif">Length</text>
<text data-packet-label="range" x="396" y="232" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace">8–23 / 16b</text>
</g>
<g data-packet-field="kind" data-field-name="Kind" data-bit-offset="24" data-bit-width="8">
<rect x="896" y="156" width="256" height="104" fill="#2d3142" stroke="#f08a59" stroke-width="2"/>
<text data-packet-label="name" x="908" y="192" fill="#f5f5f5" font-size="16" font-family="Geist, sans-serif">Kind</text>
<text data-packet-label="range" x="908" y="232" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace">24–31 / 8b</text>
</g>
</g>
<g data-packet-row="32">
<text data-packet-row-label="true" x="64" y="384" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace">32</text>
<g data-packet-field="sequence" data-field-name="Sequence" data-bit-offset="32" data-bit-width="32">
<rect x="128" y="324" width="1024" height="104" fill="#2d3142" stroke="#bfc0c0" stroke-width="2"/>
<text data-packet-label="name" x="140" y="360" fill="#f5f5f5" font-size="16" font-family="Geist, sans-serif">Sequence</text>
<text data-packet-label="range" x="140" y="400" fill="#bfc0c0" font-size="12" font-family="Geist Mono, monospace">32–63 / 32b</text>
</g>
</g>
<text data-packet-source-label="true" x="128" y="536" fill="#bfc0c0" font-size="12" font-family="Geist, sans-serif">Illustrative frame schema · 64 bits</text>
</svg>
</div>
</div>
</body>
</html>
