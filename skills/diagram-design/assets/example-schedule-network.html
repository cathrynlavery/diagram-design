-diagram-role="precedence"><path d="M 576 472 H 592 Q 600 472 600 464 V 364 Q 600 356 608 356 H 612" fill="none" stroke="#4f5d75" stroke-width="1"/><path d="M 616 350 L 624 356 L 616 362" fill="none" stroke="#4f5d75" stroke-width="1"/></g><g data-schedule-link="finish-to-start" data-from="D" data-to="E" data-critical="true" data-diagram-role="precedence"><path d="M 864 328 H 900" fill="none" stroke="#2d3142" stroke-width="2"/><path d="M 904 322 L 912 328 L 904 334" fill="none" stroke="#2d3142" stroke-width="2"/></g><g data-task-id="A" data-task-name="Scope" data-duration="2" data-critical="true" data-rank="0" data-diagram-role="task"><rect x="48" y="240" width="240" height="176" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="2"/><text x="64" y="264" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="name">A: Scope</text><text x="64" y="288" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="duration">DUR 2 days</text><text x="64" y="316" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="es">ES 0</text><text x="176" y="316" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="ef">EF 2</text><text x="64" y="344" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="ls">LS 0</text><text x="176" y="344" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="lf">LF 2</text><text x="64" y="372" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="tf">TF 0</text><text x="64" y="396" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="status">CRITICAL</text></g><g data-task-id="B" data-task-name="Build" data-duration="4" data-critical="true" data-rank="1" data-diagram-role="task"><rect x="336" y="96" width="240" height="176" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="2"/><text x="352" y text><text x="928" y="316" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="es">ES 8</text><text x="1040" y="316" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="ef">EF 9</text><text x="928" y="344" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="ls">LS 8</text><text x="1040" y="344" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="lf">LF 9</text><text x="928" y="372" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="tf">TF 0</text><text x="928" y="396" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-field="status">CRITICAL</text></g><text x="48" y="660" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-summary="assumptions">ILLUSTRATIVE SCHEDULE · days · ORIGIN 0 · FINISH-TO-START · ZERO LAG</text><text x="48" y="688" fill="#2d3142" font-size="12" font-family="Geist Mono, monospace" data-schedule-summary="scale">Task widths and spacing are not proportional to time.</text></svg></div></div></body></html>
