name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/lint-skin.py --all --baseline

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      # The checks first, so a broken linter can't report a clean repository.
      - run: python3 scripts/lint-render.py --self-test
      - run: python3 scripts/lint-render.py --all
